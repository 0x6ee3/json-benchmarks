colossus {
  service.benchmark {
    request-metrics: false
  }

  metrics.system {
    system-metrics {
      enabled: false
      namespace: "__NAME__"
    }

    collection-intervals: ["1 second", "1 minute"]
    enabled: false
    collector-defaults {
      rate {
        enabled: false
        prune-empty: false
      }
      histogram {
        enabled: false
        percentiles: [0.75, 0.9, 0.99, 0.999, 0.9999]
        sample-rate: 1.0
        prune-empty: false
      }
      counter {
        enabled: false
      }
    }
  }
}
